  question: "What does SoundStorm do, according to these papers?"
  should_refuse: true
  key_facts: ["SoundStorm appears only as a cited title in Moshi's references; the papers never describe it"]
  gold: []
  note: "References trap (pitfall 1): the keyword exists only in the bibliography"
  